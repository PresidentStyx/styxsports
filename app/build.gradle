plugins {
    id 'com.android.application'
}

// Optional release signing: create keystore.properties (git-ignored) with
//   storeFile=keystore/styxsports.jks
//   storePassword=...
//   keyAlias=...
//   keyPassword=...
// If it is missing, the release build falls back to the debug keystore so it
// still produces an installable APK.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.styxsports.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.styxsports.tv'
        minSdk 21
        targetSdk 35
        // Keep versionName == git tag without the "v"; the in-app updater compares them.
        versionCode 11
        versionName '2.5'
    }

    signingConfigs {
        if (keystoreProps['storeFile']) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreProps['storeFile'] ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Version-agnostic file names so a Downloader code pointing at
    // .../releases/latest/download/StyxSports.apk keeps working across updates.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = variant.buildType.name == 'release'
                    ? 'StyxSports.apk'
                    : "StyxSports-${variant.baseName}.apk"
        }
    }
}

dependencies {
    // Only for FileProvider (needed to hand the update APK to the installer on API 24+).
    implementation 'androidx.core:core:1.13.1'
    // Team crests are served as SVG; Android has no built-in SVG decoder.
    implementation 'com.caverock:androidsvg-aar:1.4'
}
