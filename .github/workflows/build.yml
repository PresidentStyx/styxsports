name: Build APK

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # `secrets` cannot be used in step `if:` directly; expose a boolean here instead.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Signing key from repository secrets. The in-app updater only works if every
      # release carries the same signature as the build already installed on the TV,
      # so this MUST be the same key used for local builds:
      #   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/styxsports.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/styxsports.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Refuse to publish a release with a mismatched signature
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE != 'true'
        run: |
          echo "KEYSTORE_BASE64 secret is missing; an APK signed with a different key"
          echo "would break in-app updates for installed users."
          exit 1

      - name: Build release APK
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease

      # Certificate fingerprint of the key every installed copy was signed with.
      # If this ever differs, installed apps would reject the update.
      - name: Verify signing certificate
        env:
          EXPECTED_SHA256: 635e078695157fe065e0346c5eda4573999e6562490c3bbc2f4570aba4a0d827
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          ACTUAL=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/StyxSports.apk \
            | sed -n 's/.*SHA-256 digest: //p' | head -n1)
          echo "certificate sha256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "Signing certificate mismatch; refusing to continue." >&2
            exit 1
          fi

      # StyxSports-v1.0.apk is kept as an alias because the original Downloader
      # code points at that file name.
      - name: Stage release files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/StyxSports.apk out/StyxSports.apk
          cp app/build/outputs/apk/release/StyxSports.apk out/StyxSports-v1.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StyxSports-apk
          path: out/StyxSports.apk

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
